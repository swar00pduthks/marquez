version: "3.7"
services:
  api:
    image: "${MARQUEZ_REGISTRY:-swar00pduth}/marquez:${TAG}"
    # platform: linux/amd64
    container_name: marquez-api
    environment:
      - MARQUEZ_PORT=${API_PORT}
      - MARQUEZ_ADMIN_PORT=${API_ADMIN_PORT}
      - POSTGRES_HOST=db
      # Pass the schema explicitly on the JDBC connection (appended to the URL in
      # marquez.dev.yml as ${POSTGRES_QUERY_PARAMS}). Defaults to the public schema.
      - POSTGRES_QUERY_PARAMS=?currentSchema=${POSTGRES_SCHEMA:-public}
      - SEARCH_ENABLED=${SEARCH_ENABLED}
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${API_ADMIN_PORT}:${API_ADMIN_PORT}"
    volumes:
      - data:/opt/marquez
    links:
      - "db:postgres"
    depends_on:
      - db
    entrypoint: ["/opt/marquez/wait-for-it.sh", "db:${POSTGRES_PORT}", "--", "./entrypoint.sh"]

  db:
    build:
      context: docker/postgres-age
    image: marquez-postgres-age:latest
    container_name: marquez-db
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - MARQUEZ_DB=marquez
      - MARQUEZ_USER=marquez
      - MARQUEZ_PASSWORD=marquez
      # Schema owned by the marquez user; init-db.sh grants ownership so Flyway
      # can create objects on PostgreSQL 15+. Must match currentSchema above.
      - MARQUEZ_SCHEMA=${POSTGRES_SCHEMA:-public}
    volumes:
      - db-conf:/etc/postgresql
      - db-init:/docker-entrypoint-initdb.d
      - db-backup:/var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # Enables SQL statement logging (see: https://www.postgresql.org/docs/12/runtime-config-logging.html#GUC-LOG-STATEMENT)
    # command: ["postgres", "-c", "log_statement=all"]

volumes:
  data:
  db-conf:
  db-init:
  db-backup:
