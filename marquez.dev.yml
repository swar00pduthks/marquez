server:
  applicationConnectors:
  - type: http
    port: ${MARQUEZ_PORT:-5000}
    httpCompliance: RFC7230_LEGACY
  adminConnectors:
  - type: http
    port: ${MARQUEZ_ADMIN_PORT:-5001}

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-marquez}${POSTGRES_QUERY_PARAMS:-}
  user: ${POSTGRES_USER:-marquez}
  password: ${POSTGRES_PASSWORD:-marquez}

migrateOnStartup: true

# Apache AGE graph extension toggle. Default true for v3-beta deployments.
# Set MARQUEZ_AGE_ENABLED=false at deploy time to disable.
ageEnabled: ${MARQUEZ_AGE_ENABLED:-true}

graphql:
  enabled: true

logging:
  level: INFO
  appenders:
    - type: console

search:
  enabled: ${SEARCH_ENABLED:-true}
  scheme: http
  host: ${SEARCH_HOST:-opensearch}
  port: ${SEARCH_PORT:-9200}
  username: admin
  password: admin

backfill:
  batchSize: ${BACKFILL_BATCH_SIZE:-500}
  delayBetweenBatchesMs: ${BACKFILL_DELAY_MS:-50}
  enabledVersions: ${BACKFILL_ENABLED_VERSIONS:-[]}

tags:
  - name: PII
    description: Personally identifiable information
  - name: SENSITIVE
    description: Contains sensitive information
